name: auth-service-pipeline
on:
  push:
    branches:
      - main
  workflow_dispatch: 
env:
  DOTNET_VERSION: "8.0"
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  DOCKERHUB_REGISTRY: "mohammadaszadali"
  SERVICE_NAME: "auth-service"
  
permissions:
    contents: read
    id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: checkout_code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get Commit Hash
        id: get_commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: dotnet restore
        run: dotnet restore ./AuthorizationService
      - name: dotnet publish
        run: dotnet publish ./AuthorizationService -c Release -o ./publish
      - name: Build Docker Image
        run: docker build -t ${{ env.SERVICE_NAME }}:$(git rev-parse --short HEAD) .
      - name: Tag Docker Image
        run: docker tag ${{ env.SERVICE_NAME }}:$(git rev-parse --short HEAD) ${{ env.DOCKERHUB_REGISTRY }}/${{ env.SERVICE_NAME }}:$(git rev-parse --short HEAD)
      - name: Docker Login
        run: echo ${{ env.DOCKERHUB_PASSWORD }} | docker login -u ${{ env.DOCKERHUB_USERNAME }} --password-stdin        
      - name: Push Docker Image
        run: docker push ${{ env.DOCKERHUB_REGISTRY }}/${{ env.SERVICE_NAME }}:$(git rev-parse --short HEAD)
      - name: checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: aali-awsdevops/dtag-argocd-apps
          token: ${{ secrets.GIT_TOKEN }}
          path: dtag-argocd-apps
      - name: update image tag in deployment.yaml
        run: |
          sed -i "s|image: mohammadaszadali/auth-service:.*|image: mohammadaszadali/auth-service:$(git rev-parse --short HEAD)|" dtag-argocd-apps/dtag-auth-service/deployment.yaml
      - name: commit and push changes to gitops repo
        run: |
          cd dtag-argocd-apps
          git config --global user.name "github-actions"
          git config --global user.email "cluesofdevops@gmail.com"
          git add dtag-auth-service/deployment.yaml
          git commit -m "Update auth-service image tag to $(git rev-parse --short HEAD)"
          git push origin HEAD
