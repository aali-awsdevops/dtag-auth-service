name: auth-service-pipeline
on:
  push:
    branches:
      - main
  workflow_dispatch: 
env:
  DOTNET_VERSION: "8.0"
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  SERVICE_NAME: "auth-service"
permissions:
    contents: read
    id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout_code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get Commit Hash
        id: get_commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: dotnet restore
        run: dotnet restore
      - name: dotnet publish
        run: dotnet publish ./AuthorizationService -c Release -o ./publish
      - name: Build Docker Image
        run: docker build -t ${{ env.SERVICE_NAME }}:$(git rev-parse --short HEAD) .
      - name: Tag Docker Image
        run: docker tag ${{ env.SERVICE_NAME }}:$(git rev-parse --short HEAD) ${{ env.DOCKERHUB_USERNAME }}/${{ env.SERVICE_NAME }}:$(git rev-parse --short HEAD)
      - name: Docker Login
        run: echo ${{ env.DOCKERHUB_PASSWORD }} | docker login -u ${{ env.DOCKERHUB_USERNAME }} --password-stdin        
      - name: Push Docker Image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.SERVICE_NAME }}:$(git rev-parse --short HEAD)
       

